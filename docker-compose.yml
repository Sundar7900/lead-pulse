version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: leadpulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: leadpulse
    volumes:
      - mongodb_data:/data/db
    networks:
      - leadpulse-network

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      DATABASE_NAME: leadpulse
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80,*"
    depends_on:
      - mongodb
    networks:
      - leadpulse-network

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: leadpulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - leadpulse-network

volumes:
  mongodb_data:

networks:
  leadpulse-network:
    driver: bridge
